<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Scene Viewer 对照测试</title>
<style>
  :root { --bg: #f2f2f7; --card: #fff; --fg: #1d1d1f; --muted: #6e6e73; --accent: #0071e3; --line: #d2d2d7; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000; --card: #1c1c1e; --fg: #f5f5f7; --muted: #98989f; --accent: #2997ff; --line: #38383a; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 -apple-system, system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; display: grid; gap: 14px; }
  h1 { font-size: 22px; margin: 0; }
  p { margin: 0; color: var(--muted); }
  .row { background: var(--card); border-radius: 14px; padding: 14px; display: grid; gap: 10px; }
  .row h2 { font-size: 16px; margin: 0; }
  .row small { color: var(--muted); word-break: break-all; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  a.btn { flex: 1; min-width: 120px; text-align: center; padding: 10px; border-radius: 10px; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; }
  a.btn.alt { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .result { font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: var(--muted); min-height: 1.5em; }
</style>
</head>
<body>
<main>
  <h1>Scene Viewer 对照测试</h1>
  <p>依次点每个按钮，看能不能打开，回到这页后下方会显示结果和编号。3D 模式只需要 Google App；AR 模式还需要 ARCore。示例模型分别放在 GitHub 和谷歌服务器上，用来判断网络。</p>
  <div id="rows"></div>
</main>
<script>
// Each test opens Scene Viewer through the same kind of intent link the main page uses (Google app),
// with a different model or mode, and reports what happened to /api/diag (kind "svtest").
const MODELS = [
  { key: "ours", name: "我们的模型（本服务器）", url: null },
  { key: "github", name: "示例模型（GitHub）", url: "https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Avocado/glTF-Binary/Avocado.glb" },
  { key: "google", name: "示例模型（谷歌服务器）", url: "https://modelviewer.dev/shared-assets/models/Astronaut.glb" },
];
const MODES = [["3d_only", "3D 模式"], ["ar_preferred", "AR 模式"]];
const FALLBACK_HASH = "#sv-fallback";

function intentUrl(file, mode) {
  const params = new URLSearchParams({ file, mode, resizable: "false", title: "Test" });
  const fallback = encodeURIComponent(location.href.split("#")[0] + FALLBACK_HASH);
  return `intent://arvr.google.com/scene-viewer/1.0?${params}#Intent;scheme=https;package=com.google.android.googlequicksearchbox;action=android.intent.action.VIEW;S.browser_fallback_url=${fallback};end;`;
}

function post(report) {
  const body = JSON.stringify(report);
  fetch("/api/diag", { method: "POST", headers: { "Content-Type": "application/json" }, body, keepalive: true })
    .catch(() => navigator.sendBeacon?.("/api/diag", new Blob([body], { type: "application/json" })));
}

// Page hidden = Scene Viewer took over; hash back = no Google app; neither within 3 s = nothing opened.
// Every visibility change is recorded, so a viewer that opens and closes at once shows up as hidden→visible.
function track(test, out) {
  const id = Math.random().toString(36).slice(2, 8), t0 = performance.now(), events = [];
  let done = false;
  const mark = (name) => events.push({ name, ms: Math.round(performance.now() - t0) });
  const onVis = () => mark(`visibility:${document.visibilityState}`);
  const onBlur = () => mark("blur");
  const onHash = () => { if (location.hash === FALLBACK_HASH) { mark("fallback"); history.replaceState(null, "", location.pathname); finish(); } };
  document.addEventListener("visibilitychange", onVis); window.addEventListener("blur", onBlur); window.addEventListener("hashchange", onHash);
  out.textContent = `${id}: 等待中…`;
  function finish() {
    if (done) return;
    done = true;
    document.removeEventListener("visibilitychange", onVis); window.removeEventListener("blur", onBlur); window.removeEventListener("hashchange", onHash);
    const names = events.map((e) => e.name);
    const outcome = names.includes("fallback") ? "fallback" : names.includes("visibility:hidden") ? "left_page" : "stayed";
    const away = events.find((e) => e.name === "visibility:hidden"), back = events.find((e) => e.name === "visibility:visible");
    const seconds = away && back ? ((back.ms - away.ms) / 1000).toFixed(1) : null;
    post({ id, kind: "svtest", test, outcome, events, awaySeconds: seconds, ua: navigator.userAgent });
    out.textContent = `${id}: ${outcome === "fallback" ? "没有 Google App（跳回本页）" : outcome === "stayed" ? "没打开" : `打开了，离开 ${seconds ?? "?"} 秒`}`;
  }
  // Wait until the page has been visible again for a moment, so a viewer that stays open isn't cut short
  const check = () => {
    if (done) return;
    const age = performance.now() - t0;
    const away = events.some((e) => e.name === "visibility:hidden");
    if ((!away && age > 3000) || (away && document.visibilityState === "visible" && age > 1500)) finish();
    else setTimeout(check, 500);
  };
  setTimeout(check, 500);
}

async function main() {
  const rows = document.getElementById("rows");
  let ours = null;
  try {
    const r = await fetch("/api/models", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ shape: "rect", dims: { A: 12, B: 16 }, height_ft: 3, stair_edge: "B" }) });
    ours = new URL((await r.json()).glb_url, location.href).href;
  } catch (err) {
    ours = null;
  }
  for (const m of MODELS) {
    const file = m.key === "ours" ? ours : m.url;
    const row = document.createElement("section"); row.className = "row";
    row.innerHTML = `<h2>${m.name}</h2><small>${file ?? "模型生成失败"}</small><div class="btns"></div><div class="result"></div>`;
    const out = row.querySelector(".result");
    if (file) for (const [mode, label] of MODES) {
      const a = document.createElement("a");
      a.className = "btn" + (mode === "3d_only" ? " alt" : ""); a.textContent = label; a.href = intentUrl(file, mode);
      a.addEventListener("click", () => track(`${m.key}/${mode}`, out));
      row.querySelector(".btns").appendChild(a);
    }
    rows.appendChild(row);
  }
}
main();
</script>
</body>
</html>
